# Self-hosted backend: API server, the model (Ollama on the CPU) and a PDF renderer for it, counter
# store for limits and beta metrics, HTTPS proxy.
# Run from deploy/ with `docker compose up -d --build`; settings come from deploy/.env (see
# .env.example and README.md in this folder).
name: docnavigator

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: docnavigator-api
    restart: unless-stopped
    # Server variables (LLM_*, MIN_APP_VERSION, limits, METRICS_TOKEN...) as src/server reads them.
    env_file: .env
    environment:
      # Only Caddy reaches this container, and it sets X-Real-IP from the TCP peer.
      TRUST_PROXY: 'true'
      DEVICE_ID_HASH_KEY: ${DEVICE_ID_HASH_KEY:?Set DEVICE_ID_HASH_KEY in deploy/.env}
      # The Upstash REST API, served by redis-http over the local Redis (SPEC §8.3).
      UPSTASH_REDIS_REST_URL: http://redis-http
      UPSTASH_REDIS_REST_TOKEN: ${COUNTER_STORE_TOKEN:?Set COUNTER_STORE_TOKEN in deploy/.env}
      # The model of this compose file; deploy/.env can point elsewhere (SPEC D-6) or set `mock`.
      LLM_PROVIDER: ${LLM_PROVIDER:-openai-compatible}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://llm:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3.6:35b-native}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-none}
      PDF_RENDER_URL: ${PDF_RENDER_URL:-http://pdf-render:8080}
    depends_on:
      redis-http:
        condition: service_started
      llm-pull:
        condition: service_completed_successfully
      pdf-render:
        condition: service_healthy
    read_only: true
    tmpfs: /tmp
    security_opt: ['no-new-privileges:true']
    # Uploads in flight get 90 s to finish when the container is replaced. Queued and running
    # analysis jobs live only in the process's memory and are lost: the app gets 404 and offers to
    # try again, without charging the limit (SPEC §7.1).
    stop_grace_period: 95s
    logging: *logging

  redis:
    image: redis:8.10-alpine
    restart: unless-stopped
    # Counters and beta metrics live up to 90 days (SPEC §8.7): keep them across restarts.
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt: ['no-new-privileges:true']
    logging: *logging

  # Upstash-compatible REST proxy (https://github.com/hiett/serverless-redis-http): the server
  # talks to this Redis over HTTP with UpstashCounterStore, plain fetch and no Redis client.
  redis-http:
    image: hiett/serverless-redis-http:0.0.10
    restart: unless-stopped
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${COUNTER_STORE_TOKEN:?Set COUNTER_STORE_TOKEN in deploy/.env}
      SRH_CONNECTION_STRING: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    security_opt: ['no-new-privileges:true']
    logging: *logging

  # The model, on the CPU (SPEC D-6, until the public release). Loaded once and kept in memory,
  # one analysis at a time; the context fits a few pages of images and the prompt.
  llm:
    image: ollama/ollama:0.32.5
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: '-1'
      OLLAMA_CONTEXT_LENGTH: ${LLM_CONTEXT_LENGTH:-32768}
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      # Ollama's llama-server reads its flags from LLAMA_ARG_* too. Its prompt cache in RAM (8 GB by
      # default) copies every finished prompt when the next one starts: a 50-page PDF adds about
      # 2.5 GB at once, more than the model leaves free, and the kernel kills the runner. The one
      # slot keeps the system prompt read without it (deploy/README.md, «Модель»).
      LLAMA_ARG_CACHE_RAM: '0'
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt: ['no-new-privileges:true']
    logging: *logging

  # Downloads the model on the first start (24 GB for qwen3.6:35b); later starts find it and exit.
  # A name ending in `-native` is the model without Ollama's own chat renderer: the same weights,
  # created here from the model before the suffix, so llama-server applies the model's chat template
  # itself, knows where the messages start, and keeps the system prompt read between analyses
  # (hybrid models such as qwen3.6 can't reuse it otherwise; deploy/README.md, «Модель»).
  llm-pull:
    image: ollama/ollama:0.32.5
    environment:
      OLLAMA_HOST: http://llm:11434
      LLM_MODEL: ${LLM_MODEL:-qwen3.6:35b-native}
    # `ollama create` reads the weights from the files the server names, so the same volume.
    volumes:
      - ollama-models:/root/.ollama:ro
    entrypoint:
      - sh
      - -c
      - |
        set -e
        ollama show "$$LLM_MODEL" > /dev/null 2>&1 && exit 0
        base="$${LLM_MODEL%-native}"
        ollama show "$$base" > /dev/null 2>&1 || ollama pull "$$base"
        [ "$$base" = "$$LLM_MODEL" ] && exit 0
        ollama show --modelfile "$$base" | grep -E '^(FROM|PARAMETER) ' > /tmp/Modelfile
        ollama create "$$LLM_MODEL" -f /tmp/Modelfile
    depends_on:
      llm:
        condition: service_healthy
    restart: 'no'
    logging: *logging

  # PDF pages as JPEG for the model, which reads only images. Keeps nothing.
  pdf-render:
    build: ./pdf-render
    image: docnavigator-pdf-render
    restart: unless-stopped
    read_only: true
    tmpfs: /tmp
    security_opt: ['no-new-privileges:true']
    logging: *logging

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in deploy/.env}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

volumes:
  ollama-models:
  redis-data:
  caddy-data:
  caddy-config:
