# Self-hosted backend: API server, counter store for limits and beta metrics, HTTPS proxy.
# Run from deploy/ with `docker compose up -d --build`; settings come from deploy/.env (see
# .env.example and README.md in this folder).
name: docnavigator

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: docnavigator-api
    restart: unless-stopped
    # Server variables (LLM_*, MIN_APP_VERSION, limits, METRICS_TOKEN...) as src/server reads them.
    env_file: .env
    environment:
      # Only Caddy reaches this container, and it sets X-Real-IP from the TCP peer.
      TRUST_PROXY: 'true'
      DEVICE_ID_HASH_KEY: ${DEVICE_ID_HASH_KEY:?Set DEVICE_ID_HASH_KEY in deploy/.env}
      # The Upstash REST API, served by redis-http over the local Redis (SPEC §8.3).
      UPSTASH_REDIS_REST_URL: http://redis-http
      UPSTASH_REDIS_REST_TOKEN: ${COUNTER_STORE_TOKEN:?Set COUNTER_STORE_TOKEN in deploy/.env}
    depends_on:
      redis-http:
        condition: service_started
    read_only: true
    tmpfs: /tmp
    security_opt: ['no-new-privileges:true']
    # An analysis waits up to 90 s for the model; let it finish when the container is replaced.
    stop_grace_period: 95s
    logging: *logging

  redis:
    image: redis:8.10-alpine
    restart: unless-stopped
    # Counters and beta metrics live up to 90 days (SPEC §8.7): keep them across restarts.
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt: ['no-new-privileges:true']
    logging: *logging

  # Upstash-compatible REST proxy (https://github.com/hiett/serverless-redis-http), so the server
  # talks to this Redis with the same UpstashCounterStore it uses on EAS Hosting.
  redis-http:
    image: hiett/serverless-redis-http:0.0.10
    restart: unless-stopped
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${COUNTER_STORE_TOKEN:?Set COUNTER_STORE_TOKEN in deploy/.env}
      SRH_CONNECTION_STRING: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    security_opt: ['no-new-privileges:true']
    logging: *logging

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in deploy/.env}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

volumes:
  redis-data:
  caddy-data:
  caddy-config:
